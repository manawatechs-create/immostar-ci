<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F97316" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Étoile stylisée -->
  <g filter="url(#shadow)">
    <polygon 
      points="60,10 72,40 105,40 80,60 90,92 60,75 30,92 40,60 15,40 48,40" 
      fill="url(#starGradient)" 
      stroke="#EA580C" 
      stroke-width="1"
    />
  </g>
  
  <!-- Petit cercle décoratif -->
  <circle cx="95" cy="15" r="4" fill="#10B981" />
  
  <!-- Texte Immo -->
  <text x="125" y="72" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="900" fill="url(#textGradient)" letter-spacing="-1">
    Immo
  </text>
  
  <!-- Texte Star -->
  <text x="290" y="72" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="300" fill="#F97316" letter-spacing="-1">
    Star
  </text>
  
  <!-- Petit point décoratif -->
  <circle cx="430" cy="60" r="3" fill="#F97316" opacity="0.5"/>
  
  <!-- Ligne décorative sous le texte -->
  <line x1="125" y1="85" x2="430" y2="85" stroke="url(#starGradient)" stroke-width="2" opacity="0.3"/>
</svg>
